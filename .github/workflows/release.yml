name: Release

# Cut a release by pushing a tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Builds a self-contained binary for every supported platform and attaches them,
# with checksums, to a GitHub release. Nothing here needs a signing key or a
# hosted service; anyone with a fork can produce identical artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

defaults:
  run:
    # Git Bash on Windows too, so one script works on every runner.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing should not deny everybody else a download.
      fail-fast: false
      matrix:
        include:
          - label: Windows (x86-64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            native: true

          # Statically linked against musl, so one binary runs on any Linux
          # distribution regardless of its glibc version.
          - label: Linux (x86-64, static)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar
            native: true

          # Kept alongside the static build as a fallback, in case anything ever
          # needs the system allocator or glibc's resolver.
          - label: Linux (x86-64, glibc)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar
            native: true

          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
            native: true

          # Cross-compiled from the Apple Silicon runner, which ships both SDKs.
          # The dedicated Intel runner image is being retired and its queue is
          # long enough to hold up a release.
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar
            native: false

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Install musl tooling
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p kahui-cli

      - name: Check it runs
        # Only where the binary matches the runner's architecture. A binary that
        # will not start is worth catching before it is published; a
        # cross-compiled one simply cannot be tried here.
        if: matrix.native
        run: ./target/${{ matrix.target }}/release/kahui --version

      - name: Package
        id: package
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="kahui-${VERSION}-${TARGET}"
          mkdir -p "dist/$STAGE"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/$TARGET/release/kahui.exe" "dist/$STAGE/"
          else
            cp "target/$TARGET/release/kahui" "dist/$STAGE/"
          fi
          cp README.md LICENSE CONTRIBUTING.md "dist/$STAGE/"

          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$STAGE.zip" "$STAGE" > /dev/null
            echo "asset=dist/$STAGE.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$STAGE.tar.gz" "$STAGE"
            echo "asset=dist/$STAGE.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kahui-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop — ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            args: ""
          # Built on the oldest supported image so the .deb and AppImage work on
          # more than just the newest distributions.
          - label: Linux
            os: ubuntu-22.04
            args: ""
          - label: macOS (Apple Silicon)
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - label: macOS (Intel)
            os: macos-latest
            args: "--target x86_64-apple-darwin"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Webview toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-release-${{ matrix.label }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: desktop-release-${{ matrix.label }}-

      - run: npm ci
        working-directory: desktop

      - name: Bundle
        run: npm run tauri build -- ${{ matrix.args }}
        working-directory: desktop

      # A Tauri binary built without the Tauri CLI does not embed the interface
      # at all -- it points at the dev server instead, and opens an empty window
      # that looks exactly like a hung app. `npm run tauri build` above does it
      # correctly, but the failure is silent, so check rather than trust.
      #
      # The check is for the hashed asset filename Vite just emitted: present
      # only if the interface really was baked in.
      - name: The interface must be embedded in the binary
        run: |
          ASSET=$(basename desktop/dist/assets/*.js)
          BIN=$(find target -type f -path '*release*' -name 'kahui-desktop*' ! -name '*.d' | head -1)
          echo "looking for $ASSET in $BIN"
          if grep -qa "$ASSET" "$BIN"; then
            echo "ok - the interface is embedded"
          else
            echo "::error::this build has no interface in it and would open an empty window"
            exit 1
          fi

      # Tauri writes installers under target/release/bundle (or under the target
      # triple when cross-compiling). Collect whatever it produced.
      - name: Collect installers
        id: collect
        run: |
          mkdir -p desktop-dist
          find target -path '*/release/bundle/*' -type f             \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg'                -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \)             -exec cp {} desktop-dist/ \;
          ls -la desktop-dist
          test -n "$(ls -A desktop-dist)" || { echo "no installers were produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: kahui-desktop-${{ matrix.label }}
          path: desktop-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Checksums
        run: |
          cd staging
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          cat > notes.md <<NOTES
          Kāhui is an open-source, decentralised alternative to Discord where communities
          are hosted by their members. Running this binary makes your machine part of every
          community you have joined. There is nothing to sign up for.

          ## Install the app

          Most people want this one. Download the installer for your platform,
          run it, and you get a window.

          | Platform | File |
          |---|---|
          | Windows | \`.msi\` or \`-setup.exe\` |
          | macOS | \`.dmg\` (pick Apple Silicon or Intel) |
          | Linux | \`.AppImage\` (runs anywhere) or \`.deb\` |

          ## Or the command line client

          A single binary with no window, for servers and for scripting. Unpack
          and run \`kahui\`.

          | Platform | File |
          |---|---|
          | Windows | \`kahui-${VERSION}-x86_64-pc-windows-msvc.zip\` |
          | Linux | \`kahui-${VERSION}-x86_64-unknown-linux-musl.tar.gz\` (static, runs anywhere) |
          | macOS, Apple Silicon | \`kahui-${VERSION}-aarch64-apple-darwin.tar.gz\` |
          | macOS, Intel | \`kahui-${VERSION}-x86_64-apple-darwin.tar.gz\` |

          On Linux and macOS:

          \`\`\`bash
          tar xzf kahui-${VERSION}-<your-platform>.tar.gz
          cd kahui-${VERSION}-<your-platform>
          chmod +x kahui
          ./kahui
          \`\`\`

          macOS will refuse an unsigned binary on first run: **System Settings → Privacy &
          Security → Open Anyway**. The project has no Apple developer certificate, and
          buying one would mean a company standing between you and the software.

          ## Then

          \`\`\`
          /create My Community      # prints an invite to share
          /join kahui1...           # join someone else's
          /help                     # everything else
          \`\`\`

          Verify your download against \`SHA256SUMS\`. Every artifact here was built from
          this tag by a public workflow you can read in \`.github/workflows/release.yml\`.

          ---
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/* --clobber
          else
            gh release create "$TAG" staging/* \
              --title "Kāhui $TAG" \
              --notes-file notes.md \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
