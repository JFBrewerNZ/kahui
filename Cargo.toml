[workspace]
resolver = "2"
members = [
    "crates/kahui-proto",
    "crates/kahui-store",
    "crates/kahui-net",
    "crates/kahui-node",
    "crates/kahui-cli",
    "desktop/src-tauri",
]

# The desktop app needs a webview toolchain to build, which a headless Linux box
# does not have by default. Keeping it out of the default set means `cargo test`
# stays a one-liner everywhere; CI builds it in a job of its own.
default-members = [
    "crates/kahui-proto",
    "crates/kahui-store",
    "crates/kahui-net",
    "crates/kahui-node",
    "crates/kahui-cli",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.85"
# AGPL, deliberately. Kahui exists so that communities are not captured by
# whoever hosts them; the network clause (section 13) is what stops someone
# doing exactly that with this code. Anyone running a modified Kahui as a
# service must publish their source.
license = "AGPL-3.0-or-later"
repository = "https://github.com/JFBrewerNZ/kahui"
authors = ["The Kahui Contributors"]

[workspace.dependencies]
kahui-proto = { path = "crates/kahui-proto", version = "0.5.1" }
kahui-store = { path = "crates/kahui-store", version = "0.5.1" }
kahui-net   = { path = "crates/kahui-net",   version = "0.5.1" }
kahui-node  = { path = "crates/kahui-node",  version = "0.5.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
anyhow = "1"
blake3 = "1"
ed25519-dalek = "2"
rand = "0.8"
hex = "0.4"
bs58 = "0.5"
redb = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
libp2p = { version = "0.56", features = [
    "tokio", "gossipsub", "mdns", "identify", "request-response", "cbor",
    "noise", "yamux", "tcp", "quic", "macros", "ed25519", "ping",
    # Reachability. Every node both offers relaying and can use it, so a
    # community behind home routers needs no infrastructure of its own.
    "relay", "dcutr", "autonat",
    # Ask the home router to open a port. When it works there is no relay, no
    # hole punch and no third party at all -- just a reachable node.
    "upnp",
] }

[profile.release]
opt-level = 2
